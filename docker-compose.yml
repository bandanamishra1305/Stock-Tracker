services:
  db:
    image: postgres:15-alpine
    container_name: stocktrack_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_secure_password
      POSTGRES_DB: stocktrack
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: stocktrack_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - DATABASE_URL=postgresql://postgres:postgres_secure_password@db:5432/stocktrack
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-password}
      - TOTP_SECRET=${TOTP_SECRET:-JBSWY3DPEHPK3PXP}
      - JWT_SECRET=${JWT_SECRET:-super_secret_jwt_key_stocktrack}
    depends_on:
      - db

  frontend:
    build: ./frontend
    container_name: stocktrack_frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend

volumes:
  pgdata:
